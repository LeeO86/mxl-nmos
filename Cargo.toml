[package]
name = "mxl-nmos"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Adrian Hilber <LeeO86@users.noreply.github.com>"]
description = "AMWA NMOS node (IS-04 v1.3, IS-05 v1.2, BCP-007-03) for MXL media functions"
repository = "https://github.com/LeeO86/mxl-nmos"
readme = "README.md"
keywords = ["nmos", "mxl", "amwa", "broadcast"]
categories = ["network-programming", "multimedia"]
publish = false

[features]
default = []
# mDNS/DNS-SD registry browsing and node advertisement. Even with the feature,
# both stay off unless `Settings::dns_sd` is true.
dns-sd = ["dep:mdns-sd"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3"
hostname = "0.4"
mdns-sd = { version = "0.21", optional = true }
network-interface = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "rt", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
uuid = { version = "1.23", features = ["serde", "v4", "v5"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tempfile = "3.27"
tokio = { version = "1.52", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
missing_docs = "warn"
